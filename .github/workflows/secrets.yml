name: Verify GitHub secret

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the secret is configured
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "API_TOKEN is not configured."
            exit 1
          fi
          echo "API_TOKEN is configured."