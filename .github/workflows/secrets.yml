name: Verify GitHub secret

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the secret is configured
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API_KEY is not configured."
            exit 1
          fi
          echo "API_KEY is configured."